{% extends 'base.html' %}

{% block body_class %}page-app{% endblock %}

{% block body %}
<header class="navbar">
    <a class="navbar__brand" href="{% url 'tickets:list' %}">Pytende</a>
    <div class="navbar__actions">
        <a class="btn {% block nav_new_class %}btn--primary{% endblock %}" href="{% url 'tickets:create' %}">Novo atendimento</a>
        <form method="post" action="{% url 'accounts:logout' %}">
            {% csrf_token %}
            <button class="btn btn--tertiary" type="submit">Sair</button>
        </form>
    </div>
</header>
<main class="container{% block container_class %}{% endblock %}">
    {% include 'includes/messages.html' %}
    {% block content %}{% endblock %}
</main>
{% endblock %}
